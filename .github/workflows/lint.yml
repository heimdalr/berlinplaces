name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Run Linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
